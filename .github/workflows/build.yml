name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Patch manifest and activity
        run: |
          python3 - <<'PY'
          import os
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          add = ''
          if 'RECORD_AUDIO' not in s:
              add += '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
          if 'RecognitionService' not in s:
              add += '    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n'
          s = s.replace('</manifest>', add + '</manifest>')
          open(p, 'w').write(s)
          d = 'android/app/src/main/java/com/cellvoltage/logger'
          os.makedirs(d, exist_ok=True)
          open(d + '/MainActivity.java', 'w').write('''package com.cellvoltage.logger;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              }
          }
          ''')
          PY
      - name: Sync web files
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: voltage-logger-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
