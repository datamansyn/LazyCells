<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LazyCells</title>
<style>
:root{--bg:#eef2f0;--card:#fff;--tx:#14201b;--mut:#66756e;--ac:#12a36f;--ac2:#0b7f55;--acx:#fff;--bd:#dbe3df;--soft:#f3f7f5;--warn:#d9480f;--rec:#e03131;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0c1210;--card:#151e1a;--tx:#ecf3ef;--mut:#8a9a92;--ac:#2fd69a;--ac2:#1ea777;--acx:#04251a;--bd:#25322c;--soft:#1b2722;--warn:#ff922b;--rec:#ff6b6b;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:14px 14px 28px}
header{display:flex;align-items:center;gap:12px;padding:6px 4px 14px}
header svg{color:var(--ac);flex:none}
.brand{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1}
.brand b{color:var(--ac)}
.tag{font-size:13px;color:var(--mut);margin-top:3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px}
.hero{text-align:center;padding:22px 16px 18px}
.last{font-size:68px;font-weight:800;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.last small{font-size:24px;font-weight:600;color:var(--mut);margin-left:4px;letter-spacing:0}
.last.w{color:var(--warn)}
#heard{font-size:14px;color:var(--mut);margin:8px 0 18px;min-height:20px}
#mic{position:relative;width:132px;height:132px;border-radius:50%;border:0;background:linear-gradient(145deg,var(--ac),var(--ac2));color:var(--acx);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 10px 28px rgba(18,163,111,.35)}
#mic svg{width:46px;height:46px}
#mic span{font-size:12px;font-weight:700;max-width:100px;line-height:1.15}
#mic.on{background:linear-gradient(145deg,var(--rec),#c92a2a);color:#fff;box-shadow:0 10px 28px rgba(224,49,49,.4)}
#mic.on::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--rec);opacity:.6;animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){#mic.on::after{animation:none}}
#status{font-size:13px;color:var(--mut);margin-top:16px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.head strong{font-size:16px}.head span{font-size:12px;color:var(--mut)}
ol{margin:0;padding:0;list-style:none;max-height:38vh;overflow-y:auto}
li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--bd)}
li:last-child{border-bottom:0}
li .n{width:26px;height:26px;border-radius:8px;background:var(--soft);color:var(--mut);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
li .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;width:76px}
li .bar{flex:1;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
li .bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
li.w .v{color:var(--warn)}li.w .bar i{background:var(--warn)}
li button{border:0;background:none;color:var(--mut);font-size:16px;padding:6px 8px}
.empty{color:var(--mut);padding:18px 4px;font-size:14px;text-align:center;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.s{padding:12px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--soft);color:var(--tx);font-size:14px;font-weight:600}
button.p{flex:1;background:var(--ac);color:var(--acx);border-color:var(--ac);font-size:15px}
input[type=number],input[type=text]{padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--soft);color:var(--tx);font-size:15px;width:76px}
#manual{flex:1;min-width:0;width:auto}
details summary{font-weight:700;font-size:15px;cursor:pointer;list-style:none}
details summary::after{content:"\25BE";float:right;color:var(--mut)}
label{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
.set{display:flex;flex-direction:column;gap:12px;margin-top:14px}
</style>
</head>
<body>
<header>
  <svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true"><rect x="3" y="13" width="37" height="22" rx="6" fill="none" stroke="currentColor" stroke-width="3"/><rect x="42" y="20" width="4" height="8" rx="2" fill="currentColor"/><path d="M25 16 17 26h6l-2 7 10-11h-6z" fill="currentColor"/></svg>
  <div><div class="brand">Lazy<b>Cells</b></div><div class="tag">Say the voltage. It gets logged.</div></div>
</header>

<section class="card hero">
  <div id="last" class="last">&ndash;</div>
  <div id="heard">Tap the mic, then read out a cell voltage</div>
  <button id="mic" aria-label="Start or stop listening">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    <span id="miclabel">Tap to start</span>
  </button>
  <div id="status">Say &ldquo;3.143&rdquo; or &ldquo;three point one four three&rdquo;. Say &ldquo;undo&rdquo; to remove the last one.</div>
</section>

<div class="stats">
  <div class="stat"><b id="count">0</b><span>Cells</span></div>
  <div class="stat"><b id="smin">&ndash;</b><span>Min</span></div>
  <div class="stat"><b id="smax">&ndash;</b><span>Max</span></div>
  <div class="stat"><b id="sspr">&ndash;</b><span>Spread</span></div>
</div>

<section class="card">
  <div class="head"><strong>Readings</strong><span>tap &#10005; to remove</span></div>
  <ol id="list"></ol>
  <div class="row" style="margin-top:12px">
    <button class="s p" id="copy">Copy list</button>
    <button class="s" id="undo">Undo</button>
    <button class="s" id="clear">Clear</button>
  </div>
  <div class="row" style="margin-top:10px">
    <input type="text" id="manual" inputmode="decimal" placeholder="Type a value manually">
    <button class="s" id="add">Add</button>
  </div>
</section>

<details class="card">
  <summary>Settings</summary>
  <div class="set">
    <div class="row">
      <label>Decimals <input type="number" id="dec" min="1" max="5" value="3"></label>
      <label>Warn below <input type="number" id="lo" step="0.1" value="2.0"></label>
      <label>above <input type="number" id="hi" step="0.1" value="4.5"></label>
    </div>
    <label><input type="checkbox" id="auto" checked> If I only say digits (&ldquo;three one four three&rdquo;), put the point after the first digit</label>
    <label><input type="checkbox" id="beep" checked> Beep when a number is recorded</label>
  </div>
</details>

<script>

(function(){
  var $=function(i){return document.getElementById(i)};
  var readings=[],listening=false,rec=null,wake=null,actx=null;
  var KEY="lazycells-v1";

  function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);readings=o.r||[];
    ["dec","lo","hi"].forEach(function(k){if(o[k]!=null)$(k).value=o[k]});
    if(o.auto!=null)$("auto").checked=o.auto;if(o.beep!=null)$("beep").checked=o.beep}}catch(e){}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({r:readings,dec:$("dec").value,lo:$("lo").value,hi:$("hi").value,auto:$("auto").checked,beep:$("beep").checked}))}catch(e){}}

  function render(){
    var lo=parseFloat($("lo").value),hi=parseFloat($("hi").value),ol=$("list");
    ol.innerHTML="";
    if(!readings.length){ol.innerHTML='<div class="empty">No readings yet.<br>Your cells will show up here.</div>'}
    readings.forEach(function(v,i){
      var x=parseFloat(v),bad=(x<lo||x>hi);
      var pct=Math.max(0,Math.min(100,(x-lo)/(hi-lo)*100));
      var li=document.createElement("li");if(bad)li.className="w";
      li.innerHTML='<span class="n">'+(i+1)+'</span><span class="v">'+v+'</span><span class="bar"><i style="width:'+pct+'%"></i></span>';
      var b=document.createElement("button");b.textContent="\u2715";b.setAttribute("aria-label","Delete");
      b.onclick=function(){readings.splice(i,1);save();render()};
      li.appendChild(b);ol.appendChild(li);
    });
    $("count").textContent=readings.length;
    var nums=readings.map(parseFloat).filter(isFinite);
    if(nums.length){
      var mn=Math.min.apply(null,nums),mx=Math.max.apply(null,nums);
      $("smin").textContent=mn.toFixed(3);$("smax").textContent=mx.toFixed(3);
      $("sspr").textContent=Math.round((mx-mn)*1000)+" mV";
    }else{$("smin").textContent=$("smax").textContent=$("sspr").textContent="\u2013"}
    var last=readings[readings.length-1],lx=parseFloat(last);
    $("last").innerHTML=last?last+"<small>V</small>":"\u2013";
    $("last").className="last"+(last&&(lx<lo||lx>hi)?" w":"");
    ol.scrollTop=ol.scrollHeight;
  }

  function beep(){
    if(!$("beep").checked)return;
    try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=0.05;
      o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+0.08)}catch(e){}
  }

  function addValue(v){readings.push(v);save();render();beep()}

  var W={zero:0,oh:0,o:0,one:1,won:1,two:2,to:2,too:2,three:3,four:4,for:4,five:5,six:6,seven:7,eight:8,ate:8,nine:9};

  function parse(text){
    var dec=parseInt($("dec").value,10)||3,auto=$("auto").checked;
    var t=text.toLowerCase().replace(/,/g,"").replace(/(\d)\s*(point|dot|decimal)\s*(\d)/g,"$1 $2 $3");
    var tokens=t.split(/\s+/).filter(Boolean),out=[],cur="";
    function fmt(s){
      if(s.indexOf(".")<0){
        if(auto&&s.length>=2)s=s[0]+"."+s.slice(1);else if(s.length)return s;else return null;
      }
      if(s.charAt(0)===".")s="0"+s;
      return s;
    }
    function flush(){if(cur){var f=fmt(cur);if(f&&/\d/.test(f))out.push(f)}cur=""}
    function done(){var i=cur.indexOf(".");return i>=0&&cur.length-i-1>=dec}
    tokens.forEach(function(tk){
      if(/^(undo|delete|remove|scratch)$/.test(tk)){flush();out.push("UNDO");return}
      var piece=null;
      if(/^\d*\.?\d+$|^\d+\.$/.test(tk))piece=tk;
      else if(/^(point|dot|decimal)$/.test(tk))piece=".";
      else if(W.hasOwnProperty(tk)&&(cur||tk!=="to"&&tk!=="too"&&tk!=="for"&&tk!=="o"&&tk!=="won"&&tk!=="ate"))piece=String(W[tk]);
      if(piece===null){flush();return}
      if(piece==="."){if(cur.indexOf(".")>=0)flush();if(!cur)cur="0";cur+=".";return}
      if(piece.indexOf(".")>=0&&cur){flush()}
      if(done())flush();
      cur+=piece;
      if(done())flush();
    });
    flush();
    return out;
  }

  function handle(text){
    $("heard").textContent="Heard: "+text;
    parse(text).forEach(function(v){
      if(v==="UNDO"){readings.pop();save();render()}else addValue(v);
    });
  }

  function setUI(){
    $("miclabel").textContent=listening?"Listening \u2013 tap to stop":"Tap to start";
    $("mic").className=listening?"on":"";
  }

  var NativeSR=null;
  var IN_APP=false;
  try{
    var C=window.Capacitor;
    IN_APP=!!(C&&((C.isNativePlatform&&C.isNativePlatform())||C.isNative));
    if(IN_APP){NativeSR=(C.Plugins&&C.Plugins.SpeechRecognition)||(C.registerPlugin?C.registerPlugin("SpeechRecognition"):null)}
  }catch(e){}
  function setStatus(t){$("status").textContent=t}

  async function nativeLoop(){
    var fails=0;
    while(listening){
      var t0=Date.now();
      try{
        var r=await NativeSR.start({language:"en-US",maxResults:1,partialResults:false,popup:false});
        fails=0;
        if(r&&r.matches&&r.matches.length)handle(r.matches[0]);
        if(listening)setStatus("Mic is on. Say a number.");
      }catch(e){
        if(!listening)break;
        var msg=(e&&(e.message||e.errorMessage))||String(e);
        if(Date.now()-t0<400){fails++}else{fails=0}
        if(fails>=8){listening=false;setUI();setStatus("Speech error: "+msg);break}
        await new Promise(function(res){setTimeout(res,200)});
      }
    }
  }

  async function startNative(){
    try{
      var a=await NativeSR.available();
      if(!a.available){setStatus("No speech recognition service found. Install or enable the Google app.");return}
      var p=await NativeSR.requestPermissions();
      if(p.speechRecognition!=="granted"){setStatus("Microphone permission denied. Enable it in Android Settings > Apps > LazyCells > Permissions.");return}
    }catch(e){setStatus("Setup error: "+((e&&e.message)||e));return}
    listening=true;setUI();setStatus("Starting mic\u2026");nativeLoop();
  }

  function startWeb(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){$("status").textContent="Speech recognition isn’t supported in this browser. Use Chrome on Android.";return}
    rec=new SR();rec.lang="en-US";rec.continuous=true;rec.interimResults=false;rec.maxAlternatives=1;
    rec.onresult=function(e){
      for(var i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal)handle(e.results[i][0].transcript);
      }
    };
    rec.onstart=function(){$("status").textContent="Mic is on. Say a number."};
    rec.onerror=function(e){
      if(e.error==="not-allowed"||e.error==="service-not-allowed"){
        listening=false;setUI();
        var fr=false;try{fr=window.self!==window.top}catch(x){fr=true}
        $("status").textContent="Error: "+e.error+". "+(fr?"This page is running inside a frame, which blocks the mic. Open the link directly in Chrome (paste it into the address bar), not inside the Claude app.":"Microphone blocked. Check Chrome’s site settings and Android’s app permission for Chrome.");
      }else if(e.error!=="no-speech"&&e.error!=="aborted"){listening=false;setUI();$("status").textContent="Mic error: "+e.error}
    };
    rec.onend=function(){if(listening){try{rec.start()}catch(x){}}};
    listening=true;setUI();
    $("status").textContent="Starting mic…";
    try{rec.start()}catch(x){listening=false;setUI();$("status").textContent="Could not start: "+(x&&x.message||x)}
    try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(w){wake=w}).catch(function(){})}catch(e){}
  }
  function stop(){
    listening=false;setUI();
    if(NativeSR){try{NativeSR.stop()}catch(e){}}
    try{rec&&rec.stop()}catch(e){}
    try{wake&&wake.release();wake=null}catch(e){}
  }
  $("mic").onclick=function(){if(listening){stop()}else if(NativeSR){startNative()}else if(IN_APP){setStatus("Native speech plugin was not found in this build. Send this message to Claude.")}else{startWeb()}};

  $("copy").onclick=function(){
    var txt=readings.join("\n");
    function ok(){$("copy").textContent="Copied!";setTimeout(function(){$("copy").textContent="Copy list"},1500)}
    function fallback(){
      var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
      document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");ok()}catch(e){$("copy").textContent="Copy failed"}
      document.body.removeChild(ta);
    }
    try{navigator.clipboard.writeText(txt).then(ok,fallback)}catch(e){fallback()}
  };
  $("undo").onclick=function(){readings.pop();save();render()};
  $("clear").onclick=function(){if(!readings.length)return;if(confirm("Clear all "+readings.length+" readings?")){readings=[];save();render()}};
  $("add").onclick=function(){var v=$("manual").value.trim();if(/^\d*\.?\d+$/.test(v)){addValue(v);$("manual").value=""}};
  ["dec","lo","hi","auto","beep"].forEach(function(k){$(k).onchange=function(){save();render()}});

  load();render();
  if(NativeSR)setStatus("Android speech mode. Tap Start listening and say a number.");
})();
</script>
</body>
</html>
